[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slowave"
version = "0.16.3"
description = "Brain-inspired long-term memory for AI agents — zero LLM during ingest or retrieval"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
readme = "README.md"
authors = [{ name = "mrsalty" }]
keywords = ["memory", "agent", "ai", "mcp", "neuroscience", "rag", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.26",
  "faiss-cpu>=1.7",
  "click>=8.1,<9",
  "onnxruntime>=1.19",
  "transformers>=4.30",
  "huggingface-hub>=0.16",
  "mcp[cli]>=1.0,<2",
  "uvicorn>=0.20",
  "starlette>=0.27",
  "tomlkit>=0.13",
]

[project.urls]
Homepage = "https://github.com/mrsalty/slowave"
Repository = "https://github.com/mrsalty/slowave"
Issues = "https://github.com/mrsalty/slowave/issues"
Changelog = "https://github.com/mrsalty/slowave/releases"

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-timeout>=2.3",
    "pytest-randomly>=3.16",
    "pytest-rerunfailures>=15.0",
    "faiss-cpu>=1.7",
]
http = ["httpx>=0.25"]
dev = ["pytest>=9.0.3", "black", "isort", "build", "twine", "faiss-cpu>=1.7"]

[project.scripts]
slowave = "slowave.cli.main:main"
slowave-mcp = "slowave.mcp.server:main"
slowave-mcp-http = "slowave.mcp.http_server:main"

[tool.setuptools.packages.find]
include = ["slowave*"]
exclude = ["tests*", "migrations*", "scripts*"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
slowave = ["storage/schema.sql"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "slowave.cli.main",
    "slowave.cli.setup",
    "slowave.core.consolidation",
    "slowave.core.engine",
    "slowave.core.services.retrieval",
    "slowave.core.supersession_manifold",
    "slowave.dashboard.app",
    "slowave.latent.retrieval",
    "slowave.latent.replay_engine",
    "slowave.latent.transition_model",
    "slowave.symbolic.encoder",
    "slowave.symbolic.onnx_encoder",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "requires_faiss: test requires faiss library",
    "requires_model: test requires downloaded model files (spacy/transformers models)",
    "slow: slow integration test",
    "benchmark: benchmark test (long-running)",
]

[tool.ruff.lint.per-file-ignores]
# Scripts that need sys.path manipulation before imports
"scripts/*" = ["E402"]
"slowave/__main__.py" = ["E402"]
"slowave/cli/main.py" = ["E402"]
"slowave/mcp/http_server.py" = ["E402"]
"slowave/mcp/server.py" = ["E402"]
"tests/experiments/*.py" = ["E402"]
"tests/benchmarks/*.py" = ["E402"]
"tests/unit/test_setup.py" = ["E402"]
"tests/unit/test_supersession_geometry.py" = ["E402"]
"tests/unit/test_vsa.py" = ["E402"]
"tests/unit/test_working_memory_context.py" = ["E402"]

[dependency-groups]
dev = [
    "black",
    "isort",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "openai>=1.0",
    "pyarrow>=14.0",
]
