name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)publish to PyPI, e.g. slowave-v0.15.0"
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  # ── Gate: run the full test suite first ──────────────────────────────
  test:
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  # ── Release Please only after tests pass ──────────────────────────────
  release-please:
    needs: test
    if: github.repository == 'slowave-ai/slowave'
    runs-on: ubuntu-latest
    steps:
      # Recovery guard: if a release PR/version bump reached main but the
      # matching tag/release was never created, finalize that release before
      # running Release Please. Use the built-in GITHUB_TOKEN here: recovery
      # only needs contents:write and must not depend on the admin PAT used
      # for protected-main writes later in the normal release flow.
      - name: Checkout for release recovery
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Recover missing release tag
        id: recovery
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import json; print(json.load(open('.release-please-manifest.json'))['.'])")
          TAG="slowave-v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "recovered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No GitHub release exists for manifest version ${VERSION}; recovering ${TAG}."

          # Tag the commit that last changed the manifest, not the current
          # workflow-fix commit. In a stranded release this is the release PR
          # merge commit that actually introduced VERSION.
          TAG_SHA=$(git log -n 1 --format=%H -- .release-please-manifest.json)
          if [ -z "$TAG_SHA" ]; then
            echo "Unable to determine release commit from manifest history"
            exit 1
          fi

          # gh release create creates the missing tag as well when TAG does
          # not exist, so no git push/PAT is required for recovery.
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target "$TAG_SHA"

          echo "recovered=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Run Release Please
        id: release
        if: ${{ github.event_name == 'push' && steps.recovery.outputs.recovered != 'true' }}
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # When a Release Please PR is merged, the action creates the tag and
      # GitHub release. Build artifacts here and attach them to that release.
      # The recovery step above also handles a version bump that reached main
      # without the normal Release Please merge signal.
      - name: Checkout repository
        if: ${{ steps.release.outputs.release_created == 'true' || steps.recovery.outputs.recovered == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.recovery.outputs.recovered == 'true' && steps.recovery.outputs.sha || steps.release.outputs.sha }}
          token: ${{ steps.recovery.outputs.recovered == 'true' && github.token || secrets.RELEASE_PUSH_TOKEN }}

      - name: Set up Python
        if: ${{ steps.release.outputs.release_created == 'true' || steps.recovery.outputs.recovered == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release version
        id: verify
        if: ${{ steps.release.outputs.release_created == 'true' || steps.recovery.outputs.recovered == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || steps.recovery.outputs.recovered == 'true' && steps.recovery.outputs.tag || steps.release.outputs.tag_name }}"
          TAG_VERSION="${TAG#slowave-}"
          TAG_VERSION="${TAG_VERSION#v}"
          TOML_VERSION=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          if [ "$TAG_VERSION" != "$TOML_VERSION" ]; then
            echo "Release tag $TAG does not match pyproject.toml version $TOML_VERSION"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        if: ${{ steps.release.outputs.release_created == 'true' || steps.recovery.outputs.recovered == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish package to PyPI
        if: ${{ steps.release.outputs.release_created == 'true' || steps.recovery.outputs.recovered == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          pip install "twine>=6.1"
          twine upload dist/* --non-interactive --skip-existing
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Upload artifacts to GitHub release
        if: ${{ steps.release.outputs.release_created == 'true' || steps.recovery.outputs.recovered == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.verify.outputs.tag }}" dist/* --clobber

      # Emergency recovery intentionally stops after publishing the release.
      # The admin PAT is currently not authorized for Git pushes to the org
      # repository, so trying the protected-main Homebrew push would turn a
      # successfully recovered release red. Normal/manual release flows keep
      # the existing Homebrew update behavior.
      - name: Update Homebrew formula
        if: ${{ steps.recovery.outputs.recovered != 'true' && (steps.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
        run: |
          VERSION="${{ steps.verify.outputs.version }}"
          URL="https://files.pythonhosted.org/packages/source/s/slowave/slowave-${VERSION}.tar.gz"
          SHA=$(curl -sL "$URL" | shasum -a 256 | awk '{print $1}')

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout -B main origin/main

          sed -i "s|url \".*\"|url \"$URL\"|"       Formula/slowave.rb
          sed -i "s|sha256 \".*\"|sha256 \"$SHA\"|" Formula/slowave.rb
          git add Formula/slowave.rb
          git diff --cached --quiet || git commit -m "chore: bump Homebrew formula to ${VERSION}"
          git push origin HEAD:main
