                - cell [ref=f11e809]:
                  - generic [ref=f11e810]: On October 28th I, as the author and creator of Slowave, will be presenting Slowave at AI Tinkerers Milan. As you may know I believe this project is valuable and can be a good candidate for becoming a real product, such as Saas coding agent version, fullu agentic integration via SDK, support different memory verticals other than only coding agents, eg CS agents, AIOps agents, etc. Currently Slowave has little tracion (14 gh stars), dont know how many active users (no metrics tracked, fully local). Now I need to prepare a live demo, 5 to 10 minutes max, in english. No slides, no pitch, just tech insights (see Ai tinkerers rules) I need you to deep dive into Slowave system so that you thoroughly understand the system capabilites and value. Start looking at public docs, slowave.ai website, then acceptance tests are a good reference. Then you can access quickly private/docs/iterations, there's tons of info/iterations on the product. Once that is done and clear redact a document that helps you in future session to iterate on this demo project, also use slowave to remember key facts in the future. For the demo, I was planning to start with a clean Slowave installation, have a ready small project to show how I can iterated coding via slowave, random ideas - a web API endppint project with some endpoints implemented - a bug hidden in code in more than 1 endpoint scenario 1 - tell agent to remember always to run linter and typechecker before pushing - show the memory emerging in dashboard - ask agent to implement a small endpoint, then push - show that agent retrieved the memory and marked it useful scenario 2 - iterate with agent to fix the first bug - expect agent to store a new procedure here (not sure it will) - ask the agent to fix the second bug -> I would expect to reuse a procedure here then show the dashboard pages, metrics graphs, explain high level from readme the internals. I need to - come up with a solid plan first (agent-slowave interaction is not deterministic, I cant fail during demo) - implement it (get the demo project ready) - iterate and prepare presentation multiple times Now I need you to focus on the main plan. Mine are just ideas, you can come up with a better one.
