                - cell [ref=f1e1053]:
                  - generic [ref=f1e1054]: "Aggiornamento del contratto del provider: gli ID evento sono univoci solo per esercente (merchant_id), non globalmente. account_id identifica un collegamento di consegna: lo stesso evento può arrivare su account diversi dopo una rotazione delle credenziali. L’identità di un evento è ora la coppia (merchant_id, event_id). Questa regola sostituisce la precedente garanzia di unicità globale per tutti i webhook. Non modificare il codice in questa attività. Inoltre, il provider può correggere un evento già consegnato: per ogni identità va elaborata la revisione numerica più alta (revision), non la prima consegna. L’ordine di arrivo non garantisce l’ordine delle revisioni. Inoltre, merchant_2 è in pausa operativa: per ora i suoi eventi non devono essere elaborati. Questa sospensione resta valida fino a nuove istruzioni."
                  - generic [ref=f1e1055]: project:relaydesk
